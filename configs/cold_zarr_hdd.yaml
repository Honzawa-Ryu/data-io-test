# cold計測 1セル(zarr_v3 x hdd)。投入直前に手動drop必須(docs/howto.md)。
purpose: campaign
repetitions: 1                    # external では1固定

cache_policy:
  mode: cold
  drop_caches_strategy: external

matrix:
  format: [zarr_v3]
  storage: [hdd]
  num_workers: [8]
  shuffle_mode: [shard]
  decode: [true]

dataset:
  ref: synth_100k_224_v1
  chunk_size_bytes: 1048576     # 1MB

output:
  jsonl: results/trials_cold.jsonl
  purpose_tag: campaign
