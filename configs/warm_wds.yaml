# warm計測(webdataset)。フォーマットごとにdataset rootが違うため1フォーマット=1config。
# 投入: sbatch -p x-large-andre01 --mem=16G -t 04:00:00 scripts/run_iobench.sh loader \
#         --config configs/warm_wds.yaml --dataset-root <root>
purpose: campaign
repetitions: 3                    # rep0がキャッシュを温める(中央値で吸収)

cache_policy:
  mode: warm

matrix:
  format: [webdataset]
  storage: [hdd, ssd_scratch]
  num_workers: [0, 8]
  shuffle_mode: [shard]
  decode: [true]

dataset:
  ref: synth_100k_224_v1
  shard_size_bytes: 536870912   # 512MB

output:
  jsonl: results/trials_warm.jsonl
  purpose_tag: campaign
