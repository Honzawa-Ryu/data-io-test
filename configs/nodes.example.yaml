# configs/nodes.yaml のサンプル。
# TODO: ノード名/パーティション名/constraint、実マウントパス、空き容量は
#       クラスタ管理者への確認結果で置き換えること(goal.md 1節のチェックリスト)。
# 各パスは probe モジュールが論理名(nfs/hdd/ssd_scratch/tmpfs/unified)経由で解決する。
#
# 【分類の仕組み】match に書いた「空でない条件すべて」が一致したときだけその構成になる(AND)。
#   - hostname_pattern は glob(例: "*andre01*" は "andre01" も "x-andre01" もマッチ)。
#   - このクラスタは X/Y/Z がパーティションを共有しているため、partition では区別できない。
#     区別は hostname_pattern が担う。partition を書くと Slurmジョブ外(partition未設定)では
#     一致せず分類できなくなるので、識別に使わないなら書かない(空にする)のが安全。
#   - 0構成一致 or 2構成以上一致(曖昧)なら probe はエラーで停止する(黙って計測しない)。

node_classes:
  X:  # NFS + SSD scratch 構成
    match:
      hostname_pattern: "*creator*"
    paths:
      nfs: /workspace/creator/honzawa   # TODO: 実パス確定待ち
      ssd_scratch: /scratch/honzawa     # TODO: 実パス確定待ち
      tmpfs: null                       # $SLURM_TMPDIR があれば probe が自動で tmpfs 追加

  Y:  # HDD + SSD scratch 構成
    match:
      hostname_pattern: "*andre01*"
    paths:
      hdd: /workspace/andre01/honzawa   # TODO: 実パス確定待ち
      ssd_scratch: /scratch/honzawa     # TODO: 実パス確定待ち

  Z:  # GB10 ユニファイドメモリ構成
    match:
      hostname_pattern: "*grace02*"
      constraint: ["gb10"]              # Zはconstraintでも裏付け(hostnameとAND)
    paths:
      unified: /workspace/grace02/honzawa  # TODO: 実パス確定待ち
    unified_memory: true
