# configs/nodes.yaml のサンプル。使うマシンごとにコピーして編集する:
#   cp configs/nodes.example.yaml configs/nodes.yaml
# TODO: 実マウントパス、空き容量はクラスタ管理者への確認結果で置き換えること
#       (goal.md 1節のチェックリスト)。
# 各パスは probe モジュールが論理名(nfs/hdd/ssd_scratch/tmpfs/unified)経由で解決する。
#
# 【分類の仕組み】hostname_pattern の glob がホスト名に一致したクラスに分類される。
#   - 例: "*andre01*" は "andre01" にも "x-andre01" にもマッチ。
#   - クラス名は自由な文字列(マシン名でも、構成X/Y/Zのような役割名でもよい)。
#   - 0クラス一致 or 2クラス以上一致(曖昧)なら probe はエラーで停止する(黙って計測しない)。
#     hostname_pattern で識別できないマシンでは IOBENCH_NODE_CLASS=<クラス名> で明示指定できる。

node_classes:
  creator:  # 構成X: NFS + SSD scratch
    hostname_pattern: "*creator*"
    paths:
      nfs: /workspace/creator/honzawa   # TODO: 実パス確定待ち
      ssd_scratch: /scratch/honzawa     # TODO: 実パス確定待ち
      tmpfs: null                       # $SLURM_TMPDIR があれば probe が自動で tmpfs 追加

  andre01:  # 構成Y: HDD + SSD scratch
    hostname_pattern: "*andre01*"
    paths:
      hdd: /workspace/andre01/honzawa   # TODO: 実パス確定待ち
      ssd_scratch: /scratch/honzawa     # TODO: 実パス確定待ち

  grace02:  # 構成Z: GB10 ユニファイドメモリ
    hostname_pattern: "*grace02*"
    paths:
      unified: /workspace/grace02/honzawa  # TODO: 実パス確定待ち
    unified_memory: true
