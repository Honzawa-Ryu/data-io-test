[project]
name = "iobench"
version = "0.1.0"
description = "Slurm異種ノード向けIO・データ供給性能ベンチマークライブラリ"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "pandas==2.3.3",
    "numpy==2.4.1",
    "matplotlib",
    "plotly",
    "torch==2.10.0+cu128",
    "torchvision",
    "webdataset>=0.2",
    "h5py>=3.11",
    "zarr>=3.0",
    "tensorstore>=0.1.60",
    "GitPython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
iobench = "iobench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iobench"]

# pytorch index url
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# strict pytorch to be installed from "pytorch-cu128"
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
